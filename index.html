<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER — Photorealistic Composable 3D Screensaver</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237dd3fc' stroke-width='1.5' opacity='0.85'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- Minimal auto-hiding screensaver HUD -->
    <div id="hud" class="hud hidden" aria-label="Screensaver Controls">
      <div class="hud-info">
        <div class="hud-title-row">
          <span class="status-dot" id="status-dot"></span>
          <span class="hud-system-name" id="system-name">Genesis · Singularity</span>
        </div>
        <div class="hud-meta" id="system-meta">Emerging from 1px seed</div>
      </div>

      <div class="hud-actions">
        <button id="btn-morph" class="hud-btn" title="Disassemble & Reassemble into a New System (N)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 16h5v5" />
          </svg>
          <span>Morph</span>
        </button>

        <button id="btn-pause" class="hud-btn icon-only" title="Pause / Resume (Space)">
          <svg id="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="8" y1="5" x2="8" y2="19" />
            <line x1="16" y1="5" x2="16" y2="19" />
          </svg>
          <svg id="icon-play" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <polygon points="7,4 20,12 7,20" />
          </svg>
        </button>

        <button id="btn-optics" class="hud-btn icon-only" title="Optical & Motion Tuning (O)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12" />
          </svg>
        </button>

        <button id="btn-fullscreen" class="hud-btn icon-only" title="Toggle Fullscreen (F)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9" />
            <polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Expandable Optics Drawer -->
    <div id="optics-panel" class="optics-panel hidden">
      <div class="optics-header">
        <span>Optics &amp; Motion</span>
        <button id="btn-reset-optics" class="text-btn">Reset</button>
      </div>

      <label class="slider-row">
        <span>Speed</span>
        <input type="range" id="ctrl-speed" min="0.2" max="2.5" step="0.05" value="1.0" />
        <output id="val-speed">1.0×</output>
      </label>

      <label class="slider-row">
        <span>Bloom &amp; Glare</span>
        <input type="range" id="ctrl-bloom" min="0.0" max="1.2" step="0.05" value="0.34" />
        <output id="val-bloom">0.34</output>
      </label>

      <label class="slider-row">
        <span>Anamorphic Streak</span>
        <input type="range" id="ctrl-glare" min="0.0" max="1.4" step="0.05" value="0.45" />
        <output id="val-glare">0.45</output>
      </label>

      <label class="slider-row">
        <span>Lens Flare</span>
        <input type="range" id="ctrl-flare" min="0.0" max="2.0" step="0.05" value="0.85" />
        <output id="val-flare">0.85</output>
      </label>

      <label class="slider-row">
        <span>Contrast</span>
        <input type="range" id="ctrl-contrast" min="0.8" max="1.45" step="0.02" value="1.14" />
        <output id="val-contrast">1.14</output>
      </label>

      <label class="slider-row">
        <span>Exposure</span>
        <input type="range" id="ctrl-exposure" min="0.6" max="1.6" step="0.05" value="1.0" />
        <output id="val-exposure">1.00</output>
      </label>

      <div class="optics-footer">
        <span>Drag to orbit · Scroll to zoom · Keys: N morph · S singularity · Space pause · F fullscreen</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
